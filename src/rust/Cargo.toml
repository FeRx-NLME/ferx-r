[package]
name = "ferx"
version = "0.1.5"
edition = "2021"
license = "MIT"
authors = ["Ron Keizer", "Teun Post"]

[lib]
crate-type = ["staticlib"]

[features]
default = []
# Enzyme autodiff was retired in ferx-core (FeRx-NLME/ferx-core#381) in favour
# of hand-rolled analytic sensitivities, so there is no longer an `autodiff`
# feature to forward.
ci = ["ferx-core/ci"]
# Deep Compartment Models (DCM) and low-dim neural ODEs — Phase A from
# ferx-core's plans/dcm-and-low-dim-node.md. Off by default. Opt in via
# `cargo build --features nn` (or by adding it to `default` for a local
# build) to enable parsing of `[covariate_nn]` blocks and the matching
# `neural_networks` section in `FitResult` / fit YAML / .fitrx output.
nn = ["ferx-core/nn"]

[dependencies]
extendr-api = "0.9"
ferx-core = { git = "https://github.com/FeRx-NLME/ferx-core", branch = "main", default-features = false }
nalgebra = "0.35"

[profile.release]
# thin LTO keeps cross-crate inlining without the fat-LTO link-time/memory cost.
# (fat LTO was previously required for cross-crate Enzyme autodiff; that path
# was retired in ferx-core, so the stable build no longer needs it.)
lto = "thin"
