[package]
name = "ferx"
version = "0.1.5"
edition = "2021"
license = "MIT"
authors = ["Ron Keizer", "Teun Post"]

[lib]
crate-type = ["staticlib"]

[features]
default = ["autodiff"]
autodiff = ["ferx-core/autodiff"]
ci = ["ferx-core/ci"]
# Deep Compartment Models (DCM) and low-dim neural ODEs — Phase A from
# ferx-core's plans/dcm-and-low-dim-node.md. Off by default. Opt in via
# `cargo build --features nn` (or by adding it to `default` for a local
# build) to enable parsing of `[covariate_nn]` blocks and the matching
# `neural_networks` section in `FitResult` / fit YAML / .fitrx output.
nn = ["ferx-core/nn"]

[dependencies]
extendr-api = "0.9"
ferx-core = { git = "https://github.com/FeRx-NLME/ferx-core", rev = "09b80cba99549e47cdb8606d4869f5d195263f1d", default-features = false }
nalgebra = "0.33"

[profile.release]
# fat LTO is required for cross-crate Enzyme autodiff (functions differentiated
# in this crate live in ferx-core; thin LTO keeps modules separate and Enzyme
# can fail to find their bodies). The Makevars no-autodiff branch overrides
# this to "thin" via CARGO_PROFILE_RELEASE_LTO when building without Enzyme.
lto = "fat"
