[package]
name = "ferx"
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Ron Keizer", "Teun Post"]

[lib]
crate-type = ["staticlib"]

[features]
# `survival` is on by default so ferx-r ships time-to-event support: the TTE
# datareader routing (`read_population_for`) and `predict_survival` in ferx-core
# are both behind its `survival` feature, so without this they are no-ops / absent.
# (Enzyme autodiff was retired in ferx-core (FeRx-NLME/ferx-core#381) in favour of
# hand-rolled analytic sensitivities, so there is no longer an `autodiff` feature.)
default = ["survival"]
# Time-to-event / survival modelling (parametric TTE, `[event_model]` blocks,
# `predict_survival`). See ferx-core's plans/tte-survival-markov.md.
survival = ["ferx-core/survival"]
ci = ["ferx-core/ci"]
# Deep Compartment Models (DCM) and low-dim neural ODEs — Phase A from
# ferx-core's plans/dcm-and-low-dim-node.md. Off by default. Opt in via
# `cargo build --features nn` (or by adding it to `default` for a local
# build) to enable parsing of `[covariate_nn]` blocks and the matching
# `neural_networks` section in `FitResult` / fit YAML / .fitrx output.
nn = ["ferx-core/nn"]

[dependencies]
extendr-api = "0.9"
ferx-core = { git = "https://github.com/FeRx-NLME/ferx-core", branch = "main", default-features = false }
ferx-tools = { git = "https://github.com/FeRx-NLME/ferx-core", branch = "main" }
nalgebra = "0.35"

[profile.release]
# thin LTO keeps cross-crate inlining without the fat-LTO link-time/memory cost.
# (fat LTO was previously required for cross-crate Enzyme autodiff; that path
# was retired in ferx-core, so the stable build no longer needs it.)
lto = "thin"
