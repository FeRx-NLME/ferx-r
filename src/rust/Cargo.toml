[package]
name = "ferx"
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Ron Keizer", "Teun Post"]

[lib]
crate-type = ["staticlib"]

[features]
# `survival` is on by default so ferx-r ships time-to-event support: the TTE
# datareader routing (`read_population_for`) and `predict_survival` in ferx-core
# are both behind its `survival` feature, so without this they are no-ops / absent.
# (Enzyme autodiff was retired in ferx-core (FeRx-NLME/ferx-core#381) in favour of
# hand-rolled analytic sensitivities, so there is no longer an `autodiff` feature.)
default = ["survival"]
# Time-to-event / survival modelling (parametric TTE, `[event_model]` blocks,
# `predict_survival`). See ferx-core's plans/tte-survival-markov.md.
survival = ["ferx-core/survival"]
ci = ["ferx-core/ci"]
# Deep Compartment Models (DCM) and low-dim neural ODEs — Phase A from
# ferx-core's plans/dcm-and-low-dim-node.md. Enables parsing of
# `[covariate_nn]` blocks and the matching `neural_networks` section in
# `FitResult` / fit YAML / .fitrx output. Not in `default` above, but the R
# package build names it explicitly (`--no-default-features --features
# ci,nn,survival` in src/Makevars), so an `R CMD INSTALL` ships it. It is the
# heaviest part of the dependency graph; to build without it, override
# CARGO_FEATURES in the environment - see the comment on that line in
# src/Makevars.
nn = ["ferx-core/nn"]

[dependencies]
# Exact pins, extendr-macros included although nothing names it directly
# (extendr-api asks only for ^0.9.0 of it, and it is the crate that generates
# the wrapper). The glue raises by unwinding into that wrapper and doubles
# every `%` for 0.9.0's format-string `throw_r_error` - see
# `raise::format_escaped` in src/lib.rs (ferx-r #394). A release carrying
# extendr b0cb8a81 would print `%%`, so moving either pin means revisiting
# that function first; tools/check-glue-raise.sh (check 5) holds the lock to
# the same version and says so.
extendr-api = "=0.9.0"
extendr-macros = "=0.9.0"
ferx-core = { git = "https://github.com/FeRx-NLME/ferx-core", branch = "main", default-features = false }
ferx-tools = { git = "https://github.com/FeRx-NLME/ferx-core", branch = "main" }
nalgebra = "0.35"

[profile.release]
# thin LTO keeps cross-crate inlining without the fat-LTO link-time/memory cost.
# (fat LTO was previously required for cross-crate Enzyme autodiff; that path
# was retired in ferx-core, so the stable build no longer needs it.)
lto = "thin"
