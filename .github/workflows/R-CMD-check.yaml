name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 60

    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      # Guard against an accidentally-unpinned ferx-core / ferx-tools dependency.
      # src/rust/.cargo/config.toml (written by src/Makevars) carries a [patch]
      # that redirects both crates to a sibling ../ferx-core when present
      # (local-dev). If someone bumps the lock with that patch active, cargo
      # strips the `source = "git+..."` line — silently unpinning them for
      # everyone who builds without the sibling. tools/update-ferx-core-lock.sh
      # exists to do the bump safely; this guard ensures nobody bypasses it.
      #
      # Both crates come from the one repository, so they must also sit on the
      # same revision: a lock pinning them apart is two halves of a workspace
      # that is only ever tested together.
      - name: Verify ferx-core and ferx-tools are pinned in Cargo.lock
        run: |
          source_of() {
            awk -v pkg="$1" '
              $0 == "name = \"" pkg "\"" { in_pkg = 1; next }
              in_pkg && /^source = / { print; exit }
              in_pkg && /^\[\[package\]\]/ { exit }
            ' src/rust/Cargo.lock
          }
          fail=0
          for pkg in ferx-core ferx-tools; do
            case "$(source_of "$pkg")" in
              'source = "git+https://github.com/FeRx-NLME/ferx-core'*) ;;
              *) echo "::error file=src/rust/Cargo.lock::$pkg lacks a git source pin."; fail=1 ;;
            esac
          done
          core_rev=$(source_of ferx-core | sed -E 's/.*#([0-9a-f]+).*/\1/')
          tools_rev=$(source_of ferx-tools | sed -E 's/.*#([0-9a-f]+).*/\1/')
          if [ "$core_rev" != "$tools_rev" ]; then
            echo "::error file=src/rust/Cargo.lock::ferx-core ($core_rev) and ferx-tools ($tools_rev) are pinned to different revisions of the same repository."
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "Run tools/update-ferx-core-lock.sh to bump them correctly."
            exit 1
          fi

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/rust/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
          # Only fail on R CMD check ERRORs. The package currently has
          # pre-existing WARNINGs (Rd cross-refs, undocumented args, GNU make
          # extensions in Makevars, non-ASCII in roxygen comments) that are
          # out of scope for this initial CI bring-up. Tighten to "warning"
          # once those are cleaned up.
          error-on: '"error"'
