name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Build without Enzyme: the autodiff-enabled toolchain takes ~45 min to
      # compile from source, so CI uses the stable-Rust path that the package
      # supports via the `ci` cargo feature. Tests still exercise FOCE/FOCEI
      # using finite-difference gradients.
      FERX_NO_AUTODIFF: '1'

    steps:
      - uses: actions/checkout@v4

      # Guard against an accidentally-unpinned ferx-core dependency.
      # src/rust/.cargo/config.toml carries a [patch] that redirects ferx-core
      # to a sibling ../ferx-core when present (local-dev). If someone bumps
      # the lock with that patch active, cargo strips the `source = "git+..."`
      # line — silently unpinning ferx-core for everyone who builds without
      # the sibling. tools/update-ferx-core-lock.sh exists to do the bump
      # safely; this guard ensures nobody bypasses it.
      - name: Verify ferx-core is pinned in Cargo.lock
        run: |
          if ! grep -q '^source = "git+https://github.com/FeRx-NLME/ferx-core' src/rust/Cargo.lock; then
            echo "::error file=src/rust/Cargo.lock::ferx-core lacks a git source pin."
            echo "Run tools/update-ferx-core-lock.sh to bump it correctly."
            exit 1
          fi

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/rust/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
          # Only fail on R CMD check ERRORs. The package currently has
          # pre-existing WARNINGs (Rd cross-refs, undocumented args, GNU make
          # extensions in Makevars, non-ASCII in roxygen comments) that are
          # out of scope for this initial CI bring-up. Tighten to "warning"
          # once those are cleaned up.
          error-on: '"error"'
