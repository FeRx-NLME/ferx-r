name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on feature branches; never cancel a run on main
# (its result gates the branch protection status and the codecov baseline).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 60

    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # `R CMD build` installs the whole package - a full ~6 min Rust release
      # build - purely so it can knit vignettes. That is dead weight on PRs:
      # `vignettes/model-workflow.Rmd` has every chunk `eval = FALSE`, and
      # `vignettes/articles` is .Rbuildignore'd, so the knit itself takes ~2s
      # and exercises no package code. Skipping it on PRs drops one of the two
      # full Rust builds in this job. Pushes to main still do the real thing,
      # so a genuinely broken vignette cannot reach the default branch.
      FERX_BUILD_ARGS: ${{ github.event_name == 'pull_request' && 'c("--no-manual", "--no-build-vignettes")' || 'c("--no-manual")' }}
      FERX_CHECK_ARGS: ${{ github.event_name == 'pull_request' && 'c("--no-manual", "--as-cran", "--ignore-vignettes")' || 'c("--no-manual", "--as-cran")' }}

    steps:
      - uses: actions/checkout@v7

      # Guard against an accidentally-unpinned ferx-core / ferx-tools dependency.
      # A local build with a sibling ../ferx-core checkout patches both crates to
      # it, and a cargo run that resolves with that patch applied strips the
      # `source = "git+..."` lines, silently unpinning them for everyone who
      # builds without the sibling; one whose patch went unused appends
      # [[patch.unused]] tables. tools/sibling-cargo-build.sh now restores the
      # lock around that one run (#353), but a `cargo update`, a `kill -9` or a
      # checkout still holding the pre-#353 [patch] in src/rust/.cargo/config.toml
      # all reach the lock anyway.
      #
      # Both crates come from the one repository, so they must also sit on the
      # same revision: a lock pinning them apart is two halves of a workspace
      # that is only ever tested together. The check lives in a script so
      # contributors run exactly what CI runs (CLAUDE.md, "ferx-core dependency").
      - name: Verify ferx-core and ferx-tools are pinned in Cargo.lock
        run: bash tools/check-ferx-core-pin.sh

      # The step above only ever sees the committed lock, so nothing there would
      # fail if one of its checks were deleted. Feed it the damaged locks a local
      # sibling build leaves behind, and assert each verdict and message.
      - name: Test the pin check against damaged locks
        run: bash tools/test-check-ferx-core-pin.sh

      # CI never has a sibling ferx-core checkout, so the patched build path -
      # the one that rewrites Cargo.lock - is never exercised here by a real
      # build. Drive it with a stub cargo instead: the patch applied, unused,
      # mixed across the two crates, cargo failing, a lock that was already
      # stripped, a reader that goes away mid-build (dash does not run an EXIT
      # trap on SIGPIPE), and two builds racing in one checkout. Every case
      # asserts src/rust/Cargo.lock came out byte-identical.
      - name: Test the sibling build wrapper with a stub cargo
        run: bash tools/test-sibling-cargo-build.sh

      # `Rf_error()` reads its first argument as a printf format string and
      # longjmps out of Rust without unwinding, so the glue must raise in
      # exactly one place: an `#[extendr]` body returns `Result<_, String>` and
      # `entry()` raises once, after that body's frame is gone (#388, #389).
      # Most of that the compiler holds - lib.rs shadows the prelude's
      # `throw_r_error` with a local `fn throw_r_error(_: Infallible)`, so a
      # bare call is `error[E0308]` on every machine. This step covers the three
      # residues it cannot see: the shadow being deleted, a fully qualified
      # `extendr_api::throw_r_error(..)`, a second `raise_verbatim(` call site,
      # and an `#[extendr]` body that does not open with `entry(`.
      - name: Verify the glue raises through entry() only
        run: bash tools/check-glue-raise.sh

      # The real lib.rs is always in shape, so nothing above would fail if one
      # of those checks were deleted. Feed the script stub sources instead, one
      # per shape it must catch and one per shape it must not.
      - name: Test the glue-raise guard against stub sources
        run: bash tools/test-check-glue-raise.sh

      # Every ferx-core / ferx-tools `*Options` struct derives `Default`
      # (ferx-core #529, enforced there by the A4 guard in
      # tests/public_api_boundary.rs), so the glue must construct them with a
      # `..Default::default()` spread. An exhaustive literal breaks this build
      # with `error[E0063]: missing field` the moment the engine adds a field —
      # the cross-repo trap CLAUDE.md's sibling-repo note warns about, which
      # already bit us once for `SimulateOptions` (ferx-core #522 -> #200).
      #
      # The scan is textual: it opens at any `<Name>Options {` that is not a
      # declaration — the fields may start on that same line, and the literal may
      # open and close on it — tracks brace depth to the end of the literal, and
      # requires a `..` that follows `{` or `,` (or opens a line), so a `0..n`
      # range in a field value does not count as a spread. A `//` comment is
      # stripped before both tests, so a commented-out literal is not scanned and
      # a commented-out spread does not satisfy the guard.
      - name: Verify ferx-core options structs are spread-constructed
        run: |
          fail=0
          for f in src/rust/src/*.rs; do
            awk -v file="$f" '
              {
                line = $0
                sub(/^[[:space:]]+/, "", line)
                code = line
                sub(/[[:space:]]*\/\/.*$/, "", code)
              }
              code == "" { next }
              !in_lit && code ~ /[A-Za-z_][A-Za-z0-9_]*Options[[:space:]]*\{/ \
                      && code !~ /(^|[^A-Za-z0-9_])(struct|impl|fn|trait|enum)([^A-Za-z0-9_]|$)/ {
                in_lit = 1; start = NR; spread = 0; depth = 0
                match(code, /[A-Za-z_][A-Za-z0-9_]*Options/); name = substr(code, RSTART, RLENGTH)
              }
              in_lit {
                if (code ~ /(^|[{,])[[:space:]]*\.\./) spread = 1
                n = gsub(/\{/, "{", code); depth += n
                n = gsub(/\}/, "}", code); depth -= n
                if (depth <= 0) {
                  if (!spread) {
                    printf "::error file=%s,line=%d::%s is built with an exhaustive struct literal. Add `..Default::default()` so a new ferx-core field stays additive (ferx-core #529).\n", file, start, name
                    bad = 1
                  }
                  in_lit = 0
                }
              }
              END { exit (bad ? 1 : 0) }
            ' "$f" || fail=1
          done
          exit $fail

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/rust/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          # Both set from the job env above so PRs skip the vignette build
          # (and its matching check) while main keeps it. `--ignore-vignettes`
          # is required alongside `--no-build-vignettes`: without it check
          # fails on the inst/doc the build deliberately did not create.
          build_args: ${{ env.FERX_BUILD_ARGS }}
          args: ${{ env.FERX_CHECK_ARGS }}
          # Only fail on R CMD check ERRORs. The package currently has
          # pre-existing WARNINGs (Rd cross-refs, undocumented args, GNU make
          # extensions in Makevars, non-ASCII in roxygen comments) that are
          # out of scope for this initial CI bring-up. Tighten to "warning"
          # once those are cleaned up.
          error-on: '"error"'
