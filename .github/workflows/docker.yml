name: docker

# Builds the slim image (Dockerfile.slim: R + ferx + the ferx CLI, no RStudio)
# for linux/amd64 and linux/arm64 and publishes it to ghcr.io/ferx-nlme/ferx-r.
#
#   push to main  -> :<full sha>, :<short sha>, :latest
#   tag vX.Y.Z    -> :vX.Y.Z, :X.Y.Z (permanent: never replaced), and :release
#                    when it is the newest final release (the commit's :sha
#                    tags come from main)
#   pull request  -> build + smoke test only, nothing is pushed
#   manual run    -> build + smoke test only, nothing is pushed (from any branch)
#
# Pull requests and manual runs also build and smoke-test the RStudio image
# (root Dockerfile, never published), so a Dependabot base-image bump
# (.github/dependabot.yml) is tested for both images before merge.
#
# Only `push` events publish, and `on.push` below admits only main and v* tags,
# so an unreviewed branch can never reach the registry.
#
# Each architecture builds natively on its own runner (no QEMU: emulating the
# Rust release build would take hours), pushes by digest, and a final job
# stitches the digests into one multi-arch manifest under the tags above.

on:
  push:
    branches: [main]
    tags: ['v*']
    # A merge that cannot change the image publishes nothing (that commit then
    # has no :sha tag; the README says so). Later patterns win, and `!` only
    # works under `paths`, hence this shape rather than paths-ignore. GitHub
    # ignores paths filters for tag pushes, so a release always builds.
    paths:
      - '**'
      - '!**.md'
      - '!changelog.d/**'
      - '!vignettes/**'
      - '!tests/**'
      - '!.github/**'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [main]
    # A PR build is a full Rust release build per arch (~20-30 min); run it
    # only when something that shapes the image changes.
    paths:
      - Dockerfile.slim
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
      - DESCRIPTION
      - src/Makevars
      - src/rust/Cargo.toml
      - src/rust/Cargo.lock
  workflow_dispatch:

# One run per ref at a time. On main a run is never cancelled, but GitHub keeps
# only one *pending* run per group: in a burst of merges the commits in between
# are skipped and get no :sha tag (the README says so). Grouping by SHA instead
# would let an older commit finish last and repoint :latest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/ferx-nlme/ferx-r

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux/amd64, runner: ubuntu-24.04,     arch: amd64}
          - {platform: linux/arm64, runner: ubuntu-24.04-arm, arch: arm64}

    steps:
      # No token in .git/config: the checkout is the build context, so a
      # persisted credential is one .dockerignore edit away from an image.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A release tag that is already published is never replaced (see the
      # publish job). Refuse here, before an hour of builds and before anything
      # is pushed. "Re-run failed jobs" after a publish that stopped part-way
      # does not re-run this job, so that resume is still possible.
      - name: Release tag not yet published
        if: github.ref_type == 'tag'
        run: tools/docker-release-tags.sh guard "$IMAGE" "${{ github.ref_name }}"

      # Build once into the local daemon so the image can be smoke-tested
      # before anything is published.
      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.slim
          platforms: ${{ matrix.platform }}
          build-args: FERX_R_REVISION=${{ github.sha }}
          load: true
          tags: ferx-r:smoke
          cache-from: type=gha,scope=slim-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=slim-${{ matrix.arch }}

      - name: Smoke test
        run: |
          docker run --rm ferx-r:smoke ferx --help
          docker run --rm ferx-r:smoke Rscript -e '
            library(ferx)
            ex <- ferx_example("warfarin")
            fit <- ferx_fit(ex$model, ex$data, method = "gn", covariance = FALSE)
            print(fit)
            stopifnot(is.finite(fit$ofv))'
          docker image ls ferx-r:smoke

      # Before anything is pushed: no token, key, credential file, license
      # file or NONMEM license banner in the image's config, history or files.
      - name: Secret scan
        run: tools/scan-image-secrets.sh ferx-r:smoke

      # The scanner still catches what it is meant to: one planted fake per
      # detection route, a decoy it must ignore, and no secret value printed;
      # and, against a throwaway local registry, the attestation scan finds a
      # build-arg token, passes clean provenance, and reports unreadable
      # provenance as "could not read" rather than clean.
      - name: Secret scan self-test
        run: tools/test-scan-image-secrets.sh --with-attestations ferx-r:smoke

      # Same inputs, so every layer comes from the cache above; this only
      # pushes the platform image by digest.
      - name: Push by digest
        id: push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.slim
          platforms: ${{ matrix.platform }}
          build-args: FERX_R_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=slim-${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      # The push above is a cache rebuild, not the ferx-r:smoke image scanned
      # earlier. The steps below scan what was actually pushed, before the
      # digest is handed to the publish job: a failure means no tag ever points
      # at it. The pushed digest is an index holding the platform image and
      # its attestation manifest; GHCR lists each as its own package version.
      - name: Resolve the pushed image
        id: resolve
        if: github.event_name == 'push'
        env:
          INDEX: ${{ steps.push.outputs.digest }}
          SCANNED: ${{ steps.build.outputs.digest }}
        run: |
          mediatype="$(docker buildx imagetools inspect "$IMAGE@$INDEX" --format '{{.Manifest.MediaType}}')"
          case "$mediatype" in
            *image.index*|*manifest.list*)
              listing="$(docker buildx imagetools inspect "$IMAGE@$INDEX" \
                --format '{{range .Manifest.Manifests}}{{.Digest}} {{with .Platform}}{{.OS}}/{{.Architecture}}{{end}}{{println}}{{end}}')"
              echo "$listing"
              platform_manifest="$(printf '%s\n' "$listing" | awk -v p="${{ matrix.platform }}" '$2 == p {print $1; exit}')"
              children="$(printf '%s\n' "$listing" | awk 'NF {print $1}' | tr '\n' ' ')"
              if [ -z "$platform_manifest" ]; then
                echo "::error::No ${{ matrix.platform }} image in the pushed index $INDEX"; exit 1
              fi ;;
            *)
              # A single image manifest (no attestations): it is the image.
              platform_manifest="$INDEX"; children="" ;;
          esac
          echo "platform_manifest=$platform_manifest" >> "$GITHUB_OUTPUT"
          echo "children=$children" >> "$GITHUB_OUTPUT"
          if [ "$platform_manifest" = "$SCANNED" ]; then
            echo "The pushed platform image $platform_manifest is byte-identical to the scanned ferx-r:smoke."
          else
            echo "::notice::Pushed platform image $platform_manifest differs from the scanned ferx-r:smoke ($SCANNED); its own scan below decides."
          fi

      # Pulling is not scanning: a registry hiccup must not be mistaken for a
      # failed scan (which deletes the image), so it gets its own step and
      # retries.
      - name: Pull the pushed image
        if: github.event_name == 'push'
        env:
          REF: ${{ env.IMAGE }}@${{ steps.resolve.outputs.platform_manifest }}
        run: |
          for attempt in 1 2 3; do
            docker pull "$REF" && exit 0
            echo "pull attempt $attempt failed; retrying"; sleep 20
          done
          exit 1

      # The scanner exits 1 for "found a secret" and 2 for "could not check".
      # Both fail the job (nothing is tagged), but only a finding deletes the
      # pushed image: an unreadable registry must not destroy a clean one.
      - name: Secret scan of the pushed image
        id: pushed-scan
        if: github.event_name == 'push'
        run: |
          set +e
          tools/scan-image-secrets.sh "$IMAGE@${{ steps.resolve.outputs.platform_manifest }}"
          code=$?
          [ "$code" -eq 1 ] && echo "found=true" >> "$GITHUB_OUTPUT"
          exit "$code"

      # Published next to the image but never pulled: provenance (build args,
      # Dockerfile, build metadata) and SBOM.
      - name: Secret scan of the attestations
        id: attestation-scan
        if: github.event_name == 'push'
        run: |
          set +e
          tools/scan-image-secrets.sh --attestations "$IMAGE@${{ steps.push.outputs.digest }}"
          code=$?
          [ "$code" -eq 1 ] && echo "found=true" >> "$GITHUB_OUTPUT"
          exit "$code"

      # After a scan found something, the untagged index, its platform image
      # and its attestation are still in the registry, where anyone could pull
      # them by digest once the package is public. Delete all of them.
      - name: Delete the pushed image after a failed scan
        if: >-
          failure() && (steps.pushed-scan.outputs.found == 'true' ||
                        steps.attestation-scan.outputs.found == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INDEX: ${{ steps.push.outputs.digest }}
          CHILDREN: ${{ steps.resolve.outputs.children }}
        run: |
          versions="$(gh api --paginate "/orgs/FeRx-NLME/packages/container/ferx-r/versions" \
                        --jq '.[] | "\(.name) \(.id)"')" || versions=""
          left=""
          for digest in $INDEX $CHILDREN; do
            id="$(printf '%s\n' "$versions" | awk -v d="$digest" '$1 == d {print $2; exit}')"
            if [ -n "$id" ] && gh api -X DELETE "/orgs/FeRx-NLME/packages/container/ferx-r/versions/$id"; then
              echo "Deleted $digest (package version $id)."
            else
              left="$left $digest"
            fi
          done
          if [ -n "$left" ]; then
            echo "::error title=Delete these by hand::A pushed image failed its secret scan and these versions could not be deleted automatically:$left. Remove them in the package settings now."
          fi

      - name: Export digest
        if: github.event_name == 'push'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.push.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      # For tools/docker-release-tags.sh; not a build context here.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Release tags (:vX.Y.Z, :X.Y.Z) are permanent: validated work cites
      # them, so a release image is published once and never replaced
      # (tools/docker-release-tags.sh; the build job already refused a tag
      # that exists). Checked again here against this run's digests: a tag
      # pointing at exactly these images is an earlier publish of the same
      # bytes that stopped part-way ("Re-run failed jobs" reuses the digests),
      # and may be completed; anything else is refused, and a registry answer
      # other than "not found" is "could not check", never "free".
      #
      # :release floats to the newest final release: only a plain vX.Y.Z that
      # is the highest such tag in the repo moves it, so a later patch of an
      # older line (v0.4.1 after v0.5.0) or a pre-release leaves it alone. A
      # failed tag lookup fails the step rather than quietly skipping it.
      - name: Release tags
        id: rel
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tools/docker-release-tags.sh guard "$IMAGE" "$TAG" "$RUNNER_TEMP/digests"
          release="$(tools/docker-release-tags.sh is-newest "https://github.com/${{ github.repository }}" "$TAG")"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          # SHA tags come from main pushes only: a release tag's commit is also
          # built by main's run, and two builds must not race for one :sha.
          # :latest = newest main build; :release = newest final release.
          tags: |
            type=sha,format=long,prefix=,enable=${{ github.ref_type == 'branch' }}
            type=sha,prefix=,enable=${{ github.ref_type == 'branch' }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=release,enable=${{ steps.rel.outputs.release == 'true' }}

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"

      # GHCR creates a new package as private, and only an org owner can make
      # it public (a one-time step after the first publish). Until then, users'
      # `docker pull` fails without a login. This step checks what an
      # anonymous user sees (empty Docker config: no credentials) and leaves a
      # warning on every publish run until the package is public. It never
      # fails the run.
      - name: Check anonymous pull (package visibility)
        run: |
          export DOCKER_CONFIG="$(mktemp -d)"
          ref="${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
          if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
            echo "Anonymous pull of $ref works: the package is public."
          else
            msg="Anonymous pull of $ref fails: the ghcr.io package is not public. An org owner must open https://github.com/orgs/FeRx-NLME/packages/container/ferx-r/settings (or: org page > Packages > ferx-r > Package settings) and use Danger Zone > Change visibility > Public (one time)."
            echo "::warning title=GHCR package is private::$msg"
            echo "### GHCR package is private" >> "$GITHUB_STEP_SUMMARY"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi

  # The RStudio image (root Dockerfile) is not published. It is built and
  # smoke-tested on pull requests and manual runs so that a change to it, or a
  # Dependabot rocker/tidyverse bump, is tested before merge. amd64 only: the
  # recipe has no arch-specific step, and the slim job covers arm64.
  rstudio:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ferx-r:rstudio
          cache-from: type=gha,scope=rstudio
          cache-to: type=gha,mode=max,scope=rstudio

      - name: Smoke test
        run: |
          docker run --rm ferx-r:rstudio Rscript -e '
            library(ferx)
            ex <- ferx_example("warfarin")
            fit <- ferx_fit(ex$model, ex$data, method = "gn", covariance = FALSE)
            stopifnot(is.finite(fit$ofv))
            cat("OFV", fit$ofv, "\n")'
          # The CLI must carry the survival feature, like the R package.
          docker run --rm ferx-r:rstudio \
            ferx check /usr/local/lib/R/site-library/ferx/examples/models/tte_exponential.ferx
          # RStudio Server comes up.
          docker run -d --name rs -p 127.0.0.1:8787:8787 -e PASSWORD=ci-only-throwaway ferx-r:rstudio
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/auth-sign-in || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          docker logs rs | tail -20
          docker rm -f rs
          test "$code" = "200"
          docker image ls ferx-r:rstudio

      - name: Secret scan
        run: tools/scan-image-secrets.sh ferx-r:rstudio
