version: 2

# Dependabot has no R/CRAN ecosystem, so the R package's own dependencies are
# not covered here — this watches the Rust glue's crate deps and the GitHub
# Actions used in CI.
updates:
  # GitHub Actions pinned in .github/workflows/*.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"

  # Rust crate deps of the extendr glue (src/rust).
  #
  # IMPORTANT: ferx-core and ferx-tools are pinned deliberately in
  # src/rust/Cargo.lock and bumped only via tools/update-ferx-core-lock.sh.
  # Both must be ignored, not just ferx-core: they share one git source (the
  # ferx-core repository, one revision for both), so Dependabot bumping either
  # crate moves the pin for both, without the NEWS entries and skip()-gate
  # cleanup a pin bump carries. The pin check R-CMD-check runs
  # (tools/check-ferx-core-pin.sh) does not catch such a bump: both crates keep
  # their git source and stay on one revision. Any further crate taken from the
  # ferx-core repository needs an entry here too.
  - package-ecosystem: cargo
    directory: "/src/rust"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "ferx-core"
      - dependency-name: "ferx-tools"
    groups:
      # Batch low-risk minor/patch bumps into one PR; majors stay individual.
      cargo-minor-patch:
        update-types: ["minor", "patch"]
