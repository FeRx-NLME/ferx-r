version: 2

# Dependabot has no R/CRAN ecosystem, so the R package's own dependencies are
# not covered here — this watches the Rust glue's crate deps, the GitHub
# Actions used in CI, and the Docker base images (which fix the R version).
updates:
  # Docker base images: rocker/r-ver in Dockerfile.slim (both stages) and
  # rocker/tidyverse in the root Dockerfile. The tag IS the R version, so a
  # bump is a deliberate R upgrade: one grouped PR moves all three FROM lines
  # together, and the docker workflow builds and smoke-tests both images on it
  # (it does not publish from a PR). Monthly, since R releases are rare.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(docker)"
    groups:
      r-base-images:
        patterns: ["rocker/*"]

  # GitHub Actions pinned in .github/workflows/*.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"

  # Rust crate deps of the extendr glue (src/rust).
  #
  # IMPORTANT: ferx-core, ferx-tools and ferx-search are pinned deliberately in
  # src/rust/Cargo.lock and bumped only via tools/update-ferx-core-lock.sh.
  # All three must be ignored, not just ferx-core: they share one git source
  # (the ferx-core repository, one revision for all), so Dependabot bumping any
  # of them moves the pin for all, without the NEWS entries and skip()-gate
  # cleanup a pin bump carries. The pin check R-CMD-check runs
  # (tools/check-ferx-core-pin.sh) does not catch such a bump: every crate keeps
  # its git source and stays on one revision. Any further crate taken from the
  # ferx-core repository needs an entry here too, and in FERX_CRATES
  # (tools/ferx-core-lock-lib.sh). ferx-search split out of ferx-tools in
  # ferx-core #3185.
  - package-ecosystem: cargo
    directory: "/src/rust"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "ferx-core"
      - dependency-name: "ferx-tools"
      - dependency-name: "ferx-search"
    groups:
      # Batch low-risk minor/patch bumps into one PR; majors stay individual.
      cargo-minor-patch:
        update-types: ["minor", "patch"]
